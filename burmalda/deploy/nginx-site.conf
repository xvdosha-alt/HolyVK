server {
    listen 80;
    server_name holyvk-api.example.com;

    # после certbot появится ssl; пока http->app или сразу 443

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=holyvk burst=8 nodelay;
        limit_conn holyvkconn 20;
    }
}

# в http {} nginx:
# limit_req_zone $binary_remote_addr zone=holyvk:10m rate=20r/m;
# limit_conn_zone $binary_remote_addr zone=holyvkconn:10m;
